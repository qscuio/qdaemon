# QDaemon DHCP Server Configuration
# /etc/qd-dhcpd/qd-dhcpd.conf

# =============================================================================
# Global Settings
# =============================================================================

[global]
# Server identifier (IP address of this server)
server-id = 192.168.1.1

# Lease database file
lease-file = /var/lib/qd-dhcpd/leases.db

# Log level: debug, info, warn, error
log-level = info

# Enable REST API
rest-api = true
rest-port = 8080

# =============================================================================
# DHCP Pools
# =============================================================================

[pool "default"]
# Network and subnet mask
network = 192.168.1.0
netmask = 255.255.255.0

# Address range to allocate
range-start = 192.168.1.100
range-end = 192.168.1.200

# Default gateway
gateway = 192.168.1.1

# DNS servers (comma-separated)
dns-servers = 8.8.8.8, 8.8.4.4

# Domain name
domain = local

# Lease times (in seconds)
default-lease = 3600
max-lease = 86400

# =============================================================================
# Static Reservations
# =============================================================================

# [reservation "server1"]
# mac = 00:11:22:33:44:55
# ip = 192.168.1.10
# hostname = server1

# =============================================================================
# DHCP Relay Configuration
# =============================================================================

[relay]
# Enable relay mode (disable server mode if true)
enabled = false

# Upstream DHCP servers (comma-separated)
# servers = 10.0.0.1, 10.0.0.2

# Relay interfaces
# interfaces = eth1, eth2

# Option 82 settings
option82-insert = true
option82-circuit-id = interface-name
option82-remote-id = mac-address

# =============================================================================
# Interface Configuration
# =============================================================================

[interface "eth0"]
# Enable DHCP on this interface
enabled = true

# Trusted port (server-facing, skip snooping validation)
trusted = false

# =============================================================================
# DHCP Snooping
# =============================================================================

[snooping]
# Enable DHCP snooping
enabled = true

# Rate limiting (packets per second, 0 = disabled)
rate-limit = 100

# Binding database file
binding-file = /var/lib/qd-dhcpd/bindings.db
